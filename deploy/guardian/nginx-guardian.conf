# guardian.makill.xyz → Guardian web-proxy (docker, port 3006)
# แทนที่ vhost เดิมที่ติด Basic Auth — Guardian มีระบบ auth ของตัวเอง
server {
    listen 443 ssl;
    server_name guardian.makill.xyz;

    # ใช้ cert เดิมของ vhost เก่า (ปรับ path ตามจริง เช่น certbot)
    ssl_certificate     /etc/letsencrypt/live/guardian.makill.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guardian.makill.xyz/privkey.pem;

    client_max_body_size 100m;          # เอกสาร PDD/ไฟล์แนบผ่าน API

    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Guardian ใช้ websocket แจ้ง event ไปหน้า UI
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name guardian.makill.xyz;
    return 301 https://$host$request_uri;
}
